# Host-run backend connecting to compose.yaml + compose.dev.yaml.
# Load the root .env when starting from backend/ or the repository root.
# Environment variables retain precedence over these imported properties.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5433}/${POSTGRES_DB:bus_management}
spring.datasource.username=${POSTGRES_USER:bus_management}
spring.datasource.password=${POSTGRES_PASSWORD}
