# Host-run backend; use compose.host.yaml for database + Keycloak login.
# Load the root .env when starting from backend/ or the repository root.
# Environment variables retain precedence over these imported properties.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/${POSTGRES_DB:bus_management}
spring.datasource.username=${POSTGRES_USER:bus_management}
spring.datasource.password=${POSTGRES_PASSWORD}

# Host Angular proxies /api to this backend; identity keeps the same public address.
app.auth.client-secret=${OIDC_CLIENT_SECRET:local-client-secret-change-me}
app.auth.public-url=${APP_PUBLIC_URL:http://localhost:4200}
app.auth.issuer=${OIDC_ISSUER:http://localhost:${FRONTEND_PORT:8082}/identity/realms/bus-management}
app.auth.internal-issuer=${OIDC_INTERNAL_ISSUER:${app.auth.issuer}}
