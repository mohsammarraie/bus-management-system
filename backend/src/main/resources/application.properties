spring.application.name=bus-management-system
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Flyway owns the schema; Hibernate verifies mappings without changing tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.default-schema=bus_management
spring.flyway.schemas=bus_management
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.datasource.hikari.connection-timeout=3000

# OIDC authorization is browser-facing; token/JWK/userinfo traffic stays on the server.
app.auth.public-url=${APP_PUBLIC_URL:http://localhost:8082}
app.auth.issuer=${OIDC_ISSUER:http://localhost:8082/identity/realms/bus-management}
app.auth.internal-issuer=${OIDC_INTERNAL_ISSUER:${app.auth.issuer}}
app.auth.client-secret=${OIDC_CLIENT_SECRET:}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
