<mat-form-field *transloco="let t" appearance="outline" subscriptSizing="dynamic">
  <mat-label>{{ t('language.label') }}</mat-label>
  <mat-select
    [value]="language.language()"
    (selectionChange)="language.select($event.value)"
    [attr.aria-label]="t('language.label')"
  >
    <mat-option value="en"><span lang="en" dir="ltr">English</span></mat-option>
    <mat-option value="de"><span lang="de" dir="ltr">Deutsch</span></mat-option>
    <mat-option value="ar"><span lang="ar" dir="rtl">العربية</span></mat-option>
  </mat-select>
</mat-form-field>
